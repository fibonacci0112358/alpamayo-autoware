# Stage2 Alpamayo1.5 SFT config

defaults: []

model:
  _target_: finetune.sft.models.sft_alpamayo_1_5_stage2.TrainableAlpamayo1_5_Stage2
  config:
    vlm_name_or_path: nvidia/Alpamayo-1.5-10B
    vlm_backend: qwenvl3
    traj_vocab_size: 768
    tokens_per_history_traj: 16
    tokens_per_future_traj: 64
    vocab_size: 155697
    model_dtype: bfloat16
    attn_implementation: flash_attention_2
    add_special_tokens: false
  cotrain_vlm: false
  stop_grad_from_vlm: true
  stage1_vlm_checkpoint_path: null

lora:
  use_lora: false
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05

data:
  manifest_path: 206_dataset_ver1/manifest.json
  local_dir: null
  image_root: 206_dataset_ver1
  train_chunk_ids: null
  valid_chunk_ids: null
  train_file_start: 0
  train_file_end: 60
  valid_file_start: 60
  valid_file_end: 76

training:
  output_dir: outputs/stage2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1e-5
  num_train_epochs: 3  # 60 train samples × 3 epochs = 180 steps
  logging_steps: 10
  save_steps: 60  # Save checkpoint every epoch (60 train samples per epoch)
  save_total_limit: 4
  bf16: true
  fp16: false
  dataloader_num_workers: 4
