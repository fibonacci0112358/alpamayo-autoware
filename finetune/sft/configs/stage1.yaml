# Stage1 Alpamayo1.5 SFT config
#
# Example override:
#   python3 finetune/sft/train_hf_1_5.py \
#     data.manifest_path=/path/to/pai_av_stage1_manifest.jsonl \
#     data.image_root=/path/to/images \
#     training.output_dir=outputs/stage1_pai \
#     lora.use_lora=true

defaults: []

model:
  _target_: finetune.sft.models.sft_alpamayo_1_5.TrainableAlpamayo1_5
  config:
    vlm_name_or_path: nvidia/Alpamayo-1.5-10B
    vlm_backend: qwenvl3
    traj_vocab_size: 768
    tokens_per_history_traj: 16
    tokens_per_future_traj: 64
    model_dtype: bfloat16
    attn_implementation: flash_attention_2
    add_special_tokens: false
  cotrain_vlm: false
  stop_grad_from_vlm: true
  stage1_vlm_checkpoint_path: null

lora:
  use_lora: false
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05

data:
  manifest_path: null
  local_dir: null
  image_root: null
  # Backwards-compatible single chunk selector (legacy)
  chunk_ids: "0-4"
  # New: allow separate chunk lists for training and validation. If omitted,
  # `chunk_ids` is used for both (legacy behavior).
  train_chunk_ids: "0-4"
  valid_chunk_ids: "0-4"
  # Optional: manifest record slicing by index. Use these when your manifest is
  # an ordered list of samples and you want to split by record indices.
  train_file_start: null
  train_file_end: null
  valid_file_start: null
  valid_file_end: null
  use_default_keyframe: false
  features_metadata: features.csv
  clip_index_metadata: clip_index.parquet
  num_frames_per_camera: 4
  num_history_steps: 16
  num_future_steps: 64
  time_step: 0.1
  nav_text: null
  completion: null

training:
  output_dir: outputs/stage1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  num_train_epochs: 3.0
  max_steps: -1
  logging_steps: 10
  save_steps: 200
  save_total_limit: 2
  evaluation_strategy: "no"
  eval_steps: null
  bf16: true
  fp16: false
  dataloader_num_workers: 0
  report_to: []
  optim: adamw_torch
  warmup_ratio: 0.03
