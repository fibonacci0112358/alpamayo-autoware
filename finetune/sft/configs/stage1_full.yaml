# Stage1 Alpamayo1.5 Full Training Config
#
# This config splits the full 206_dataset_ver1 manifest into train (0-60) and
# validation (60-76) sets, running 3 epochs with evaluation after each epoch.
#
# Example usage:
#   python finetune/sft/train_hf_1_5.py +experiment=stage1_full lora.use_lora=true

defaults: []

model:
  _target_: finetune.sft.models.sft_alpamayo_1_5.TrainableAlpamayo1_5
  config:
    vlm_name_or_path: nvidia/Alpamayo-1.5-10B
    vlm_backend: qwenvl3
    traj_vocab_size: 768
    tokens_per_history_traj: 16
    tokens_per_future_traj: 64
    model_dtype: bfloat16
    attn_implementation: flash_attention_2
    add_special_tokens: false
  cotrain_vlm: false
  stop_grad_from_vlm: true
  stage1_vlm_checkpoint_path: null

lora:
  use_lora: false
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05

data:
  manifest_path: 206_dataset_ver1/manifest.json
  image_root: 206_dataset_ver1
  # Full train/val split: train 0-60, val 60-76 (total 76 samples)
  train_file_start: 0
  train_file_end: 60
  valid_file_start: 60
  valid_file_end: 76
  use_default_keyframe: false
  features_metadata: features.csv
  clip_index_metadata: clip_index.parquet
  num_frames_per_camera: 4
  num_history_steps: 16
  num_future_steps: 64
  time_step: 0.1
  nav_text: null
  completion: null

training:
  output_dir: outputs/stage1_full
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  num_train_epochs: 3.0
  max_steps: -1
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  eval_strategy: "epoch"
  eval_steps: null
  bf16: true
  fp16: false
  dataloader_num_workers: 0
  report_to: []
  optim: adamw_torch
  warmup_ratio: 0.03
